<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Another Timer</title>
<meta name="description" content="There are millions of timer apps. This one asks what you actually did.">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
  :root { --bg: #2340e0; --ink: #ffffff; --muted: rgba(255,255,255,.72); --tang: #ff8a47; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 17px/1.55 ui-rounded, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 48px 20px; box-sizing: border-box; }
  main { max-width: 520px; display: grid; gap: 18px; justify-items: start; }
  img { width: 112px; height: 112px; border-radius: 25px; box-shadow: 0 12px 30px rgba(0,0,0,.25); }
  .eyebrow { font: 13px/1.4 ui-monospace, Menlo, monospace; color: var(--muted); }
  h1 { font-size: 46px; line-height: 1; margin: 0; font-weight: 800; }
  h1 span { color: var(--tang); }
  p { margin: 0; color: var(--muted); font-size: 19px; }
  nav { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 8px; }
  a { color: var(--ink); font-weight: 700; text-decoration: underline; text-underline-offset: 4px; }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="Another Timer app icon">
  <div class="eyebrow">Timer app no. <span id="n">2,914,006</span></div>
  <h1>Another <span>Timer</span></h1>
  <p>There are millions of timer apps. This one asks what you actually did.</p>
  <nav>
    <a href="support.html">Support</a>
    <a href="privacy.html">Privacy Policy</a>
  </nav>
</main>
<script>
  // Same made-up counter as in the app: one more timer app every nine seconds.
  const n = 2914006 + Math.max(0, Math.floor((Date.now() - Date.UTC(2026, 9, 8)) / 9000));
  document.getElementById("n").textContent = n.toLocaleString("en-US");
</script>
</body>
</html>
