<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Another One</title>
<meta name="description" content="There are millions of to-do apps. This one gives your day a grade.">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
  :root { --bg: #eef0ed; --ink: #16201c; --muted: #5a665f; --accent: #0f7c74; --mark: #ffd23f; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #101513; --ink: #e8eee9; --muted: #9aa8a0; --accent: #4fc7bc; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 48px 20px; box-sizing: border-box; }
  main { max-width: 520px; display: grid; gap: 18px; justify-items: start; }
  img { width: 112px; height: 112px; border-radius: 25px; box-shadow: 0 12px 30px rgba(0,0,0,.18); }
  .eyebrow { font: 13px/1.4 ui-monospace, Menlo, monospace; color: var(--muted); }
  h1 { font-size: 46px; line-height: 1; margin: 0; letter-spacing: -.02em; font-stretch: expanded; }
  h1 span { color: var(--accent); }
  p { margin: 0; color: var(--muted); font-size: 19px; }
  nav { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 8px; }
  a { color: var(--accent); font-weight: 600; text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="Another One app icon">
  <div class="eyebrow">To-do app no. <span id="n">4,826,555</span></div>
  <h1>Another <span>One</span></h1>
  <p>There are millions of to-do apps. This one gives your day a grade.</p>
  <nav>
    <a href="support.html">Support</a>
    <a href="privacy.html">Privacy Policy</a>
  </nav>
</main>
<script>
  // Same made-up counter as in the app: one more to-do app every nine seconds.
  const n = 4812339 + Math.max(0, Math.floor((Date.now() - Date.UTC(2026, 9, 7)) / 9000));
  document.getElementById("n").textContent = n.toLocaleString("en-US");
</script>
</body>
</html>
